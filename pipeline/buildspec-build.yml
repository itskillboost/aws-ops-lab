# image 모듈 — 1) 빌드 단계. 파이프라인(소스: 내 Fork 의 오늘 브랜치)이 이 파일을 읽는다.
# 프로젝트 환경변수: ECR_URI(내 이미지 저장소), REGISTRY(기본 이미지를 받을 강사 미러) / 파이프라인이 넘기는 값: COMMIT_ID(소스 커밋)
# 태그 전략: 커밋 SHA 앞 7자리. 저장소가 "태그 불변"이라 같은 태그는 다시 올릴 수 없으므로, 이미 있으면 빌드를 건너뛴다.
version: 0.2
env:
  exported-variables: [IMAGE_TAG]     # 다음 단계(스캔·매니페스트)가 #{BuildVariables.IMAGE_TAG} 로 받는다
phases:
  pre_build:
    commands:
      - IMAGE_TAG=$(echo "${COMMIT_ID:-manual}" | cut -c1-7)
      - echo "== 이미지 태그 ${IMAGE_TAG} (소스 커밋 ${COMMIT_ID})"
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URI%%/*}"
  build:
    commands:
      - |
        if aws ecr describe-images --repository-name "${ECR_URI##*/}" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
          echo "== ${ECR_URI}:${IMAGE_TAG} 은 이미 있습니다 — 빌드를 건너뜁니다(태그 불변)"
        else
          echo "== 이미지 빌드 ${ECR_URI}:${IMAGE_TAG} (기본 이미지: ${REGISTRY})"
          docker build -f app/Dockerfile --build-arg REGISTRY="$REGISTRY" --build-arg APP_BUILD="$IMAGE_TAG" -t "$ECR_URI:$IMAGE_TAG" .
          docker push "$ECR_URI:$IMAGE_TAG"
        fi
  post_build:
    commands:
      - echo "== 결과 ${ECR_URI}:${IMAGE_TAG}"
