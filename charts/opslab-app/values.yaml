# Ops Lab 샘플 앱 기본값. 모듈은 --set 또는 values 파일로 필요한 것만 바꾼다.
image:
  repository: public.ecr.aws/REPLACE/opslab-app   # start.sh 가 과정 파일 registry 로 채운다
  tag: "1.0.0"
  pullPolicy: IfNotPresent
replicaCount: 2

# 앱 동작(환경변수). 장애 변형은 이 값들을 바꾼다 — app/app.py 첫머리 설명 참고
env:
  APP_VERSION: v1
  APP_MEM_MB: "50"                 # 시작할 때 잡는 메모리(MB). 평소 사용량 약 100MiB
  APP_DATA_DIR: /opt/app/data      # 시작 표식 파일을 쓰는 곳
  APP_DB_CHECK_ON_START: "1"       # 시작할 때 DB 접속 확인(실패하면 종료)

# DB·캐시 주소 — 같은 네임스페이스의 opslab-data 차트가 만든 서비스. <후속 단계>에서 Aurora 주소로 바꿀 수 있다
db:
  host: postgres
  port: "5432"
  name: opslab
  user: app
  source: secret                   # secret: 쿠버네티스 Secret(opslab-db) / vault: Vault Agent 주입(K4 층이 있는 날)
  secretName: opslab-db
redis:
  host: redis
  port: "6379"

# DB가 뜰 때까지 기다리는 init 컨테이너
waitForDb:
  enabled: true
  image: public.ecr.aws/docker/library/busybox:1.37

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

# 파드 건강검진
probes:
  startup:   { path: /health, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30 }   # 최대 60초까지 출근 준비를 기다려 준다
  liveness:  { path: /health, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
  readiness: { path: /health, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 2 }

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
# 읽기 전용 루트 파일시스템을 쓸 때 APP_DATA_DIR 에 빈 디렉터리(emptyDir)를 붙인다
dataVolume:
  enabled: false

serviceAccount:
  name: opslab-app
  annotations: {}                  # IRSA: eks.amazonaws.com/role-arn

podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

service:
  port: 80

ingress:
  enabled: false
  annotations: {}
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 60
pdb:
  enabled: false
  minAvailable: 1
