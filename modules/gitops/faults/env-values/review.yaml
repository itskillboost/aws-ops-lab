# gitops-5 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: gitops-5
checks:
  - name: 운영 앱 정의가 운영 값 파일(envs/prod/values.yaml)을 읽는다
    run: 'bash ~/opslab/modules/gitops/gitfile.sh gitops/apps/templates/prod.yaml | grep -A2 ''valueFiles:'' | grep -q ''gitops/envs/prod/values.yaml'''
    fix: 'gitops/apps/templates/prod.yaml 의 helm.valueFiles 를 ../../gitops/envs/prod/values.yaml 로 고쳐 커밋하세요'
    ref: '해답 — 변형 ①·② 조치'
  - name: 운영 앱에 매니페스트 생성 오류(ComparisonError)가 없고 Synced·Healthy 다
    run: 'kubectl -n argocd get applications.argoproj.io opslab-prod -o json | jq -e ''([.status.conditions[]? | select(.type|test("Error"))] | length == 0) and .status.sync.status == "Synced" and .status.health.status == "Healthy"'' >/dev/null'
    fix: 'argocd app get opslab-prod 의 CONDITION 메시지(…values.yaml: no such file)를 읽고 경로를 고치세요'
    ref: '해답 — 변형 ② 조치'
  - name: 운영 파드가 운영 설정(Vault 비밀 주입)으로 떠 있다
    run: 'kubectl -n app get deploy opslab-app -o jsonpath=''{.spec.template.metadata.annotations.vault\.hashicorp\.com/agent-inject}'' | grep -qx true'
    fix: '운영 앱이 개발 값을 읽으면 DB 비밀 주입·HPA 가 빠집니다 — 값 파일 경로를 고치면 Argo CD 가 운영 설정으로 되돌립니다'
    ref: '해답 — 변형 ① 조치'
  - name: 런북에 valueFiles 경로와 환경(dev·prod) 비교 확인이 있다
    run: 'grep -qiE ''valueFiles|values'' ~/opslab-work/gitops/runbook-gitops-5.md && grep -qiE ''dev'' ~/opslab-work/gitops/runbook-gitops-5.md && grep -qiE ''prod'' ~/opslab-work/gitops/runbook-gitops-5.md'
    fix: '런북에 "argocd app get opslab-prod -o yaml 의 source.helm.valueFiles 확인 → argocd app manifests 로 실제 값 확인 → dev·prod values 파일 비교(diff)" 를 적으세요'
    ref: '해답 — 런북 예시'
