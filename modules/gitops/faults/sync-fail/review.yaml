# gitops-3 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: gitops-3
checks:
  - name: 운영 앱의 마지막 동기화가 성공했고 Synced·Healthy 다
    run: 'kubectl -n argocd get applications.argoproj.io opslab-prod -o json | jq -e ''.status.operationState.phase == "Succeeded" and .status.sync.status == "Synced" and .status.health.status == "Healthy"'' >/dev/null'
    fix: 'argocd app get opslab-prod 의 마지막 작업 메시지를 읽고 원인을 고친 커밋을 푸시한 뒤 argocd app sync opslab-prod (멈춘 작업은 argocd app terminate-op opslab-prod)'
    ref: '해답 — 공통 확인'
  - name: 앱 설정(ConfigMap)이 앱보다 먼저 적용된다(sync-wave -1)
    run: 'bash ~/opslab/modules/gitops/gitfile.sh gitops/envs/prod/values.yaml | grep -A3 ''^config:'' | grep -qE ''^  wave: "-1"'''
    fix: 'gitops/envs/prod/values.yaml 의 config.wave 를 "-1" 로 — 앱(Deployment)이 읽는 설정은 앱보다 작은 wave 여야 합니다'
    ref: '해답 — 변형 ① 조치'
  - name: 배포 전 점검(PreSync 훅) 대상이 실제 DB 다
    run: '! bash ~/opslab/modules/gitops/gitfile.sh gitops/envs/prod/values.yaml | grep -q ''postgres-ro'''
    fix: 'precheck.host 를 지우거나(기본값 db.host=postgres) 실제 있는 서비스 이름으로 고치세요 — kubectl -n app logs job/opslab-app-precheck 로 훅이 무엇을 했는지 봅니다'
    ref: '해답 — 변형 ② 조치'
  - name: 준비 확인(readiness) 경로가 앱에 있는 경로다
    run: '! bash ~/opslab/modules/gitops/gitfile.sh gitops/envs/prod/values.yaml | grep -q ''/ready'''
    fix: 'probes.readiness.path 를 /health 로(또는 덧붙인 probes 블록을 지우고) 커밋하세요'
    ref: '해답 — 변형 ③ 조치'
  - name: 런북에 sync-wave·훅(hook)·헬스 판정(Progressing) 확인이 있다
    run: 'grep -qiE ''sync-?wave'' ~/opslab-work/gitops/runbook-gitops-3.md && grep -qiE ''hook|훅'' ~/opslab-work/gitops/runbook-gitops-3.md && grep -qiE ''Progressing|health|헬스'' ~/opslab-work/gitops/runbook-gitops-3.md'
    fix: '런북 2. 확인 순서에 "argocd app get 의 Operation 메시지(waiting for … / hook failed) → sync-wave 순서 → 훅(hook) Job 로그 → 리소스별 Health(Progressing) → 해당 파드 describe" 를 적으세요'
    ref: '해답 — 런북 예시'
