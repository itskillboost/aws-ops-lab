# access-1 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: access-1
checks:
  - name: 앱이 IRSA 역할로 AWS 를 부른다(/aws 가 assumed-role/<학번>-access-app-role)
    run: curl -s -m 10 "http://$(kubectl -n app get ingress opslab-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')/aws" | grep -q "assumed-role/$SID-access-app-role/"
    fix: kubectl -n app exec deploy/opslab-app -c app -- env | grep AWS_ 로 역할 ARN 을 보고, 서비스 계정 어노테이션·신뢰 정책·OIDC 공급자 순으로 확인하세요
    ref: 해답 — 공통 확인
  - name: 서비스 계정 어노테이션의 역할 ARN 이 실제 역할과 같다
    run: test "$(kubectl -n app get sa opslab-app -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}')" = "$(aws iam get-role --role-name $SID-access-app-role --query Role.Arn --output text)"
    fix: kubectl -n app annotate sa opslab-app --overwrite eks.amazonaws.com/role-arn=<aws iam get-role 로 확인한 ARN>
    ref: 해답 — 변형 ① 조치
  - name: 신뢰 정책이 app/opslab-app 서비스 계정을 허용한다
    run: aws iam get-role --role-name $SID-access-app-role --query Role.AssumeRolePolicyDocument --output json | grep -q 'system:serviceaccount:app:opslab-app"'
    fix: 신뢰 정책 Condition 의 :sub 를 system:serviceaccount:app:opslab-app 으로 고치세요(aws iam update-assume-role-policy)
    ref: 해답 — 변형 ② 조치
  - name: 클러스터의 OIDC 공급자가 있다
    run: aws iam list-open-id-connect-providers --output text | grep -q "$(aws eks describe-cluster --name $SID-cluster-eks --query cluster.identity.oidc.issuer --output text | awk -F/ '{print $NF}')"
    fix: aws iam create-open-id-connect-provider --url <클러스터 OIDC 발급자 주소> --client-id-list sts.amazonaws.com --thumbprint-list <지문>
    ref: 해답 — 변형 ③ 조치
  - name: 런북의 확인 순서에 어노테이션 → 신뢰 정책 → OIDC 공급자 순서가 있다
    run: grep -qiE '신뢰 정책|trust' ~/opslab-work/access/runbook-access-1.md && grep -qiE 'oidc' ~/opslab-work/access/runbook-access-1.md
    fix: 런북 2. 확인 순서에 "서비스 계정 어노테이션 → 신뢰 정책(sub·aud) → OIDC 공급자" 를 적으세요
    ref: 해답 — 런북 예시
