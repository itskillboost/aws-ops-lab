lab: workload-2
checks:
  - name: 앱 컨테이너의 DB 주소(DB_HOST)가 실제 있는 Service 이름이다
    run: |
      h=$(kubectl -n app get deploy opslab-app -o json | jq -r '.spec.template.spec.containers[0].env[]|select(.name=="DB_HOST").value')
      kubectl -n app get svc "${h%%.*}" >/dev/null 2>&1
    fix: DB_HOST 를 kubectl -n app get svc 에 보이는 이름(postgres)으로 고치세요
    ref: 해답 — 변형 ① 조치
  - name: 컨테이너 실행 명령을 덮어쓰지 않았거나, 덮어쓴 명령이 이미지의 기본 명령과 같은 앱(app:app)을 가리킨다
    run: |
      c=$(kubectl -n app get deploy opslab-app -o json | jq -r '.spec.template.spec.containers[0].command // [] | join(" ")')
      [ -z "$c" ] || grep -q 'app:app' <<<"$c"
    fix: command 를 지워 이미지 기본 명령(CMD)을 쓰게 하세요
    ref: 해답 — 변형 ② 조치
  - name: 읽기 전용 루트 파일시스템이면 앱이 쓰는 디렉터리(APP_DATA_DIR)에 쓰기 가능한 볼륨이 붙어 있다
    run: |
      j=$(kubectl -n app get deploy opslab-app -o json)
      [ "$(jq -r '.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem' <<<"$j")" != true ] && exit 0
      d=$(jq -r '.spec.template.spec.containers[0].env[]|select(.name=="APP_DATA_DIR").value' <<<"$j")
      jq -e --arg d "$d" '.spec.template.spec.containers[0].volumeMounts // [] | map(.mountPath==$d) | any' <<<"$j" >/dev/null
    fix: 보안상 읽기 전용을 유지하려면 /opt/app/data 에 emptyDir 을 붙이세요(helm --set dataVolume.enabled=true,securityContext.readOnlyRootFilesystem=true)
    ref: 해답 — 변형 ③ 재발 방지
  - name: 런북의 확인 순서에 "이전 컨테이너 로그(--previous)" 확인이 있다
    run: grep -qE -- '--previous|-p ' ~/opslab-work/workload/runbook-workload-2.md
    fix: 재시작하는 컨테이너는 죽기 직전 로그가 원인입니다. 런북 2. 확인 순서에 kubectl logs --previous 를 넣으세요
    ref: 해답 — 근거가 된 출력
