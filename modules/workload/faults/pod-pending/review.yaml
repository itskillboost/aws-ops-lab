# workload-1 재발 방지로 확인할 항목 — common/review.sh 가 읽는다. run 이 0으로 끝나면 충족.
lab: workload-1
checks:
  - name: 앱 컨테이너의 CPU 요청(requests)이 노드 한 대의 할당 가능량보다 작다
    run: |
      req=$(kubectl -n app get deploy opslab-app -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')
      alloc=$(kubectl get nodes -o jsonpath='{.items[0].status.allocatable.cpu}')
      python3 -c "import sys;m=lambda v:float(v[:-1])/1000 if v.endswith('m') else float(v);sys.exit(0 if m('$req')<m('$alloc') else 1)"
    fix: requests.cpu 를 kubectl top 으로 본 실제 사용량에 여유를 둔 값(예 100m)으로 되돌리세요
    ref: 해답 — 변형 ① 조치
  - name: 앱 파드에 존재하지 않는 노드 라벨을 요구하는 nodeSelector 가 없다
    run: |
      sel=$(kubectl -n app get deploy opslab-app -o json | jq -c '.spec.template.spec.nodeSelector // {}')
      [ "$sel" = "{}" ] && exit 0
      kubectl get nodes -l "$(jq -r 'to_entries|map("\(.key)=\(.value)")|join(",")' <<<"$sel")" --no-headers 2>/dev/null | grep -q .
    fix: nodeSelector 를 지우거나, 실제 노드에 있는 라벨(kubectl get nodes --show-labels)로 고치세요
    ref: 해답 — 변형 ② 조치
  - name: 노드에 실습용 출입 제한(opslab/ taint)이 남아 있지 않다
    run: test "$(kubectl get nodes -o json | jq '[.items[].spec.taints // [] | .[] | select(.key|startswith("opslab/"))] | length')" -eq 0
    fix: 점검이 끝난 노드의 taint 를 지우세요 — kubectl taint nodes --all opslab/maintenance-
    ref: 해답 — 변형 ③ 조치
  - name: 런북의 재발 방지에 "배포 전 확인(스케줄 가능 여부)" 내용이 있다
    run: grep -qiE 'requests|nodeSelector|taint|스케줄|describe' ~/opslab-work/workload/runbook-workload-1.md
    fix: 런북 5. 재발 방지에 "배포 전 kubectl describe pod 의 Events 로 스케줄 실패(FailedScheduling) 확인" 같은 항목을 적으세요
    ref: 해답 — 재발 방지
