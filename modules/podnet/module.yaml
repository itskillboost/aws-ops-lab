id: podnet
title: EKS 네트워킹
hours: 8
requires: K2        # 아침에 배포: L1 네트워크 + K1 클러스터 + K2 워크로드(샘플 앱·DB)
builds: K3          # 직접 구축: Load Balancer Controller(IRSA)·Ingress(ALB)·VPC CNI 네트워크 정책과 기본 NetworkPolicy = K3 층 (따라잡기 start.sh podnet full)
topics:
  - VPC CNI IP 고갈 (Pod Pending — IP 부족 포함)
  - Service와 Ingress 연결 단절 지점 식별
  - AWS Load Balancer Controller 타깃 unhealthy
  - CoreDNS 장애와 해석 실패
  - NetworkPolicy에 의한 차단
  - 노드와 파드 보안 그룹
# Lab ID | 장애 폴더 | 변형 수 | 구분 | 장애 유형(주입할 때 보여 줌)
labs:
  - podnet-1 | ip-exhaust | 2 | 필수 | 새 파드가 IP 를 받지 못해 뜨지 않는 장애
  - podnet-2 | svc-ingress | 3 | 필수 | 사용자가 서비스에 접속하지 못하는 장애(Service·Ingress 연결)
  - podnet-3 | lb-target | 3 | 필수 | ALB 타깃이 unhealthy 로 바뀌는 장애
  - podnet-4 | coredns | 3 | 필수 | 서비스 이름을 찾지 못하는 장애(DNS)
  - podnet-5 | netpol | 3 | 심화 | NetworkPolicy 때문에 통신이 막히는 장애
  - podnet-6 | sg | 2 | 심화 | 보안 그룹 때문에 통신이 막히는 장애
