# podnet-5 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: podnet-5
checks:
  - name: 앱 파드가 DB(postgres:5432)에 접속된다
    run: kubectl -n app exec deploy/opslab-app -c app -- python3 -c "import socket;socket.create_connection(('postgres',5432),3)"
    fix: kubectl -n app get networkpolicy 로 DB 로 가는 길을 막는 정책(출발지 라벨·Egress 포트)을 찾으세요
    ref: 해답 — 변형 ②③ 조치
  - name: 기본 거부 정책이 있다면 ALB → 앱(8080) 허용 정책도 함께 있다
    run: |
      kubectl -n app get networkpolicy -o json | jq -e '[.items[] | select(.spec.podSelector=={} and (.spec.policyTypes|index("Ingress")) and ((.spec.ingress//[])|length)==0)] | length==0' >/dev/null && exit 0
      kubectl -n app get networkpolicy -o json | jq -e '[.items[] | select(.spec.podSelector.matchLabels["app.kubernetes.io/name"]=="opslab-app") | .spec.ingress[]?.ports[]?.port] | index(8080)' >/dev/null
    fix: 기본 거부를 유지하려면 앱 파드로 들어오는 8080 을 허용하는 정책을 함께 만드세요(또는 기본 거부를 지우세요)
    ref: 해답 — 변형 ① 조치
  - name: 런북에 정책을 바꾸기 전 영향(누가 누구에게 가는지)을 확인하는 절차가 있다
    run: grep -qiE 'networkpolicy|정책|라벨|selector' ~/opslab-work/podnet/runbook-podnet-5.md
    fix: 런북 5. 재발 방지에 "정책 적용 전 kubectl describe networkpolicy 로 대상 라벨·포트 확인, 단계적 적용" 을 적으세요
    ref: 해답 — 재발 방지
