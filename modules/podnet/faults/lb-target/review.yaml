# podnet-3 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: podnet-3
checks:
  - name: ALB 타깃이 모두 healthy 다
    run: |
      for tg in $(kubectl -n app get targetgroupbindings -o jsonpath='{range .items[*]}{.spec.targetGroupARN}{"\n"}{end}'); do
        h=$(aws elbv2 describe-target-health --target-group-arn "$tg" --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
        [ -n "$h" ] && ! grep -qvw healthy <<<"$(tr '\t' '\n' <<<"$h")" || exit 1
      done
    fix: aws elbv2 describe-target-health 의 Reason(Target.ResponseCodeMismatch·Target.Timeout 등)을 보고 원인을 고치세요
    ref: 해답 — 공통 확인
  - name: Ingress 의 건강검진 경로가 앱의 /health 이고 타깃 유형이 ip 다
    run: "test \"$(kubectl -n app get ingress opslab-app -o jsonpath='{.metadata.annotations.alb\\.ingress\\.kubernetes\\.io/healthcheck-path} {.metadata.annotations.alb\\.ingress\\.kubernetes\\.io/target-type}')\" = '/health ip'"
    fix: kubectl -n app annotate ingress opslab-app --overwrite alb.ingress.kubernetes.io/healthcheck-path=/health alb.ingress.kubernetes.io/target-type=ip
    ref: 해답 — 변형 ① 조치
  - name: Ingress 에 건강검진 포트를 따로 지정하지 않았다(타깃 포트로 검사)
    run: "test -z \"$(kubectl -n app get ingress opslab-app -o jsonpath='{.metadata.annotations.alb\\.ingress\\.kubernetes\\.io/healthcheck-port}' | grep -v traffic-port)\""
    fix: kubectl -n app annotate ingress opslab-app alb.ingress.kubernetes.io/healthcheck-port-
    ref: 해답 — 변형 ③ 조치
  - name: 클러스터 보안 그룹이 ALB 보안 그룹에서 오는 8080 을 허용한다
    run: |
      CSG=$(aws eks describe-cluster --name $SID-cluster-eks --query cluster.resourcesVpcConfig.clusterSecurityGroupId --output text)
      test "$(aws ec2 describe-security-group-rules --filters Name=group-id,Values=$CSG --query "length(SecurityGroupRules[?!IsEgress && ReferencedGroupInfo.GroupId && FromPort==\`8080\`])" --output text)" -ge 1
    fix: Load Balancer Controller 가 만든 백엔드 보안 그룹(k8s-traffic-…)에서 오는 TCP 8080 을 클러스터 보안 그룹에 다시 허용하세요
    ref: 해답 — 변형 ② 조치
  - name: 런북의 확인 순서에 타깃 상태(describe-target-health)의 이유를 보는 단계가 있다
    run: grep -qiE 'target-health|타깃 상태|TargetHealth|Reason' ~/opslab-work/podnet/runbook-podnet-3.md
    fix: 런북 2. 확인 순서에 "aws elbv2 describe-target-health 로 타깃 상태와 Reason 확인" 을 적으세요
    ref: 해답 — 근거가 된 출력
