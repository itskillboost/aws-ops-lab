AWSTemplateFormatVersion: "2010-09-09"
# [cluster 모듈 주변 구성] 수강생이 콘솔·CLI 로 클러스터와 노드 그룹을 직접 만들 때 고를 "기존 역할"과 노드 시작 템플릿.
# 스택 이름 <학번>-cluster-env. common/start.sh cluster 가 L1 층 다음에 배포한다.
# 콘솔 마법사의 "새 역할 생성"은 권한 경계를 붙일 수 없으므로(지침 9.5), 경계를 붙인 역할을 여기서 미리 만든다.
# 이름은 K1 층의 역할과 겹치지 않게 짓는다(따라잡기 start.sh cluster full 은 K1 과 이 스택을 함께 배포한다).
Description: opslab cluster module env (stack <SID>-cluster-env) - cluster role, node role, node launch template for the hands-on cluster build.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"

Resources:
  # 클러스터 역할 — 관제탑(컨트롤 플레인)이 내 계정의 네트워크·로드밸런서를 다룰 때 쓰는 신분
  CtlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cluster-ctl-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonEKSClusterPolicy]
      Tags: [{ Key: Module, Value: cluster }]

  # 노드 역할 — 노드(EC2)의 신분. kubelet·VPC CNI·EBS CSI·Container Insights 에이전트·Session Manager 가 이 권한으로 동작한다
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cluster-worker-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
      Tags: [{ Key: Module, Value: cluster }]

  # 노드 시작 템플릿 — 인스턴스·볼륨 태그, IMDS 홉 제한 2, 실습용 kubelet 설정(PID 압박 판정)은 K1 층과 같다
  WorkerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${StudentId}-cluster-worker-lt"
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${StudentId}-cluster-node" }
              - { Key: Course, Value: opslab }
              - { Key: Module, Value: cluster }
              - { Key: Owner, Value: !Ref StudentId }
          - ResourceType: volume
            Tags:
              - { Key: Course, Value: opslab }
              - { Key: Module, Value: cluster }
              - { Key: Owner, Value: !Ref StudentId }
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==OPSLAB=="

            --==OPSLAB==
            Content-Type: application/node.eks.aws

            ---
            apiVersion: node.eks.aws/v1alpha1
            kind: NodeConfig
            spec:
              kubelet:
                config:
                  evictionHard:
                    memory.available: "500Mi"
                    nodefs.available: "10%"
                    nodefs.inodesFree: "5%"
                    imagefs.available: "15%"
                    pid.available: "25%"

            --==OPSLAB==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            # 실습용: 노드의 프로세스 수 한도를 8192 로 낮춰, 프로세스 폭증 때 PIDPressure 가 관찰되게 한다(cluster-2)
            echo "kernel.pid_max = 8192" > /etc/sysctl.d/90-opslab-pid.conf
            sysctl -p /etc/sysctl.d/90-opslab-pid.conf

            --==OPSLAB==--

Outputs:
  CtlRoleArn:
    Value: !GetAtt CtlRole.Arn
  WorkerRoleArn:
    Value: !GetAtt WorkerRole.Arn
  WorkerLaunchTemplate:
    Value: !Ref WorkerLaunchTemplate
