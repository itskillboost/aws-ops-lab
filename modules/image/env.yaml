AWSTemplateFormatVersion: "2010-09-09"
# [image 모듈 주변 구성] 스택 이름: <학번>-image-env (common/start.sh image 가 K5 층 다음에 배포)
# 학습 대상이 아닌 것만 미리 만든다: 서비스 역할 2개(권한 경계 포함)와 파이프라인 산출물 버킷.
# ECR 저장소·GitHub 연결·CodeBuild 프로젝트·파이프라인은 수강생이 직접 만든다.
Description: >-
  opslab image - supporting stack <SID>-image-env (deployed by common/start.sh image): pipeline and build service roles, artifact bucket. Students build the ECR repo, GitHub connection, CodeBuild projects and the pipeline.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StudentId}-image-artifacts-${AWS::AccountId}"
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration: { Rules: [{ Id: expire, Status: Enabled, ExpirationInDays: 1 }] }

  # ── 파이프라인 역할: 산출물 버킷, CodeBuild 실행, GitHub 연결 사용
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-image-pipeline-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codepipeline.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${StudentId}-image-*"
              - Effect: Allow
                Action: [codestar-connections:UseConnection, codeconnections:UseConnection]
                Resource: "*"

  # ── CodeBuild 역할(빌드·스캔·배포 프로젝트 공용). 권한을 목적별로 나눠 둔다(장애 실습에서 하나만 막기 위해)
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-image-build-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: build-basics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${StudentId}-image-*"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
        - PolicyName: ecr-push          # 이미지 올리기(빌드 프로젝트)
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: "*" }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${StudentId}-image-*"
        - PolicyName: ecr-read          # 이미지·스캔 결과 읽기(빌드 건너뛰기 판단, 스캔 게이트)
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecr:DescribeImages, ecr:DescribeImageScanFindings, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:DescribeRepositories]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${StudentId}-image-*"
        - PolicyName: git-token         # 매니페스트 커밋용 GitHub 토큰 읽기(배포 프로젝트)
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:opslab/github-token-*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${StudentId}-image-*"

Outputs:
  ImageBucket: { Value: !Ref ArtifactBucket }
  ImagePipelineRoleArn: { Value: !GetAtt PipelineRole.Arn }
  ImageBuildRoleArn: { Value: !GetAtt BuildRole.Arn }
