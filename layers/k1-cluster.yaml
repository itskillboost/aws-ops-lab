AWSTemplateFormatVersion: "2010-09-09"
# [환경 층 K1 — 클러스터 = cluster 모듈 완료 상태] EKS 클러스터·관리형 노드 그룹·OIDC 공급자·기본 애드온·Container Insights·접근 항목.
# 스택 이름 <학번>-k1. common/start.sh 가 배포하고, 이어서 layers/k1-cluster.init.sh 가 kubeconfig·StorageClass·Headlamp 를 설치한다.
# 수강생이 만드는 역할이므로 모든 IAM 역할에 L0 권한 경계(opslab-student-boundary)를 붙인다.
Description: >-
  opslab K1 cluster layer (stack <SID>-k1): EKS cluster (API auth mode, control plane logs), managed node group,
  OIDC provider, core add-ons, Container Insights, access entries (student admin, instructor read-only, FIS).

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
  EksVersion:
    Type: String
    Default: "1.37"
    Description: EKS version (course file eks_version)   # 과정 파일 eks_version
  NodeInstanceType:
    Type: String
    Default: m6i.large
    Description: Node instance type (course file node_instance_type)
  NodeCount:
    Type: Number
    Default: 2
  StudentPrincipalArn:
    Type: String
    Description: IAM principal that gets cluster admin (start.sh fills in the caller ARN)   # 클러스터 관리자 권한을 받을 IAM 주체(start.sh 가 내 ARN 을 넣음)

Resources:
  # ── 컨트롤 플레인 로그 그룹: EKS가 자동으로 만들면 보존 기간이 무기한·태그 없음이 되므로 먼저 만든다
  ControlPlaneLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/eks/${StudentId}-cluster-eks/cluster"
      RetentionInDays: 3

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cluster-eks-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonEKSClusterPolicy]

  # 노드 역할: EBS CSI 드라이버와 Container Insights 에이전트도 이 역할(인스턴스 프로필)로 동작한다(실습 단순화).
  # 앱 파드의 AWS 권한은 IRSA(access 모듈)로 따로 준다.
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cluster-node-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

  Cluster:
    Type: AWS::EKS::Cluster
    DependsOn: ControlPlaneLogs
    Properties:
      Name: !Sub "${StudentId}-cluster-eks"
      Version: !Ref EksVersion
      RoleArn: !GetAtt ClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-AppSubnets" }]
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false   # 관리자 권한은 아래 접근 항목으로 명시적으로 준다
      Logging:
        ClusterLogging:
          EnabledTypes: [{ Type: api }, { Type: audit }, { Type: authenticator }, { Type: controllerManager }, { Type: scheduler }]
      Tags:
        - { Key: Name, Value: !Sub "${StudentId}-cluster-eks" }

  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt Cluster.OpenIdConnectIssuerUrl
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: Name, Value: !Sub "${StudentId}-cluster-oidc" }

  # 노드 시작 템플릿: 인스턴스·볼륨에 태그(Course·Module·Owner)를 붙이고, 파드가 IMDS 에 닿도록 홉 제한 2
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${StudentId}-cluster-node-lt"
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 2 }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${StudentId}-cluster-node" }
              - { Key: Course, Value: opslab }
              - { Key: Module, Value: cluster }
              - { Key: Owner, Value: !Ref StudentId }
          - ResourceType: volume
            Tags:
              - { Key: Course, Value: opslab }
              - { Key: Module, Value: cluster }
              - { Key: Owner, Value: !Ref StudentId }
        # 실습용 kubelet 축출 기준(PID 포함)과 낮은 프로세스 한도 — cluster-2 PIDPressure 관찰용 (modules/cluster/env.yaml 과 같다)
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==OPSLAB=="

            --==OPSLAB==
            Content-Type: application/node.eks.aws

            ---
            apiVersion: node.eks.aws/v1alpha1
            kind: NodeConfig
            spec:
              kubelet:
                config:
                  evictionHard:
                    memory.available: "100Mi"
                    nodefs.available: "10%"
                    nodefs.inodesFree: "5%"
                    imagefs.available: "15%"
                    pid.available: "25%"

            --==OPSLAB==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            # 실습용: 노드의 프로세스 수 한도를 8192 로 낮춰, 프로세스 폭증 때 PIDPressure 가 관찰되게 한다(cluster-2)
            echo "kernel.pid_max = 8192" > /etc/sysctl.d/90-opslab-pid.conf
            sysctl -p /etc/sysctl.d/90-opslab-pid.conf

            --==OPSLAB==--

  # 기본 애드온 — 노드보다 먼저 있어야 하는 것(네트워크)
  VpcCni:
    Type: AWS::EKS::Addon
    Properties: { ClusterName: !Ref Cluster, AddonName: vpc-cni, ResolveConflicts: OVERWRITE }
  KubeProxy:
    Type: AWS::EKS::Addon
    Properties: { ClusterName: !Ref Cluster, AddonName: kube-proxy, ResolveConflicts: OVERWRITE }

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: [VpcCni, KubeProxy, NodeAccess]
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: !Sub "${StudentId}-cluster-ng"
      NodeRole: !GetAtt NodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      InstanceTypes: [!Ref NodeInstanceType]
      Subnets: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-AppSubnets" }]
      ScalingConfig: { MinSize: !Ref NodeCount, DesiredSize: !Ref NodeCount, MaxSize: 4 }
      UpdateConfig: { MaxUnavailable: 1 }
      LaunchTemplate: { Id: !Ref NodeLaunchTemplate, Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber }
      Labels: { opslab/pool: default }

  # 노드 역할 접근 항목 — 관리형 노드 그룹이 자동으로 만들지만, 이름을 고정해 두면 cluster-3 장애·원복이 단순해진다
  NodeAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !GetAtt NodeRole.Arn
      Type: EC2_LINUX

  # 나머지 애드온 — 파드로 도는 것이라 노드가 생긴 뒤에 만든다
  CoreDns:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties: { ClusterName: !Ref Cluster, AddonName: coredns, ResolveConflicts: OVERWRITE }
  EbsCsi:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties:
      ClusterName: !Ref Cluster
      AddonName: aws-ebs-csi-driver
      ResolveConflicts: OVERWRITE
      # 드라이버가 만드는 EBS 볼륨에도 실습 태그를 붙인다(정리 스크립트가 태그로 찾는다)
      ConfigurationValues: !Sub '{"controller":{"extraVolumeTags":{"Course":"opslab","Module":"base","Owner":"${StudentId}"}}}'
  SnapshotController:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties: { ClusterName: !Ref Cluster, AddonName: snapshot-controller, ResolveConflicts: OVERWRITE }
  NodeMonitoring:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties: { ClusterName: !Ref Cluster, AddonName: eks-node-monitoring-agent, ResolveConflicts: OVERWRITE }
  ContainerInsights:
    Type: AWS::EKS::Addon
    DependsOn: NodeGroup
    Properties: { ClusterName: !Ref Cluster, AddonName: amazon-cloudwatch-observability, ResolveConflicts: OVERWRITE }

  # ── 접근 항목: 누가 클러스터에 들어올 수 있는가
  StudentAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref StudentPrincipalArn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope: { Type: cluster }
  InstructorAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/opslab-instructor-readonly"
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminViewPolicy
          AccessScope: { Type: cluster }
  FisAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/opslab-fis"
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          AccessScope: { Type: cluster }

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${StudentId}-k1-ClusterName" }
  NodeRoleArn:
    Value: !GetAtt NodeRole.Arn
    Export: { Name: !Sub "${StudentId}-k1-NodeRoleArn" }
  OidcIssuer:
    Value: !GetAtt Cluster.OpenIdConnectIssuerUrl
    Export: { Name: !Sub "${StudentId}-k1-OidcIssuer" }
  OidcProviderArn:
    Value: !Ref OidcProvider
    Export: { Name: !Sub "${StudentId}-k1-OidcProviderArn" }
