# Vault 봉인 해제 CronJob — 1분마다 봉인 상태를 보고, 잠겨 있으면 Secrets Manager 의 열쇠로 연다.
# 실습 편의용이다. 운영에서는 KMS 자동 봉인 해제(auto-unseal)를 쓴다. 이미지는 샘플 앱(python·boto3 포함)을 재사용한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-unsealer
  namespace: vault
  annotations: { eks.amazonaws.com/role-arn: "__ROLE_ARN__" }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: vault-unsealer, namespace: vault, labels: { course: opslab } }
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        spec:
          serviceAccountName: vault-unsealer
          restartPolicy: Never
          containers:
            - name: unseal
              image: __IMAGE__
              env: [{ name: SECRET_ID, value: "__SECRET__" }, { name: AWS_REGION, value: ap-northeast-2 }]
              resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 128Mi } }
              command: ["python3", "-c"]
              args:
                - |
                  import json, os, urllib.request, boto3
                  V = "http://vault.vault.svc:8200/v1/sys/"
                  st = json.load(urllib.request.urlopen(V + "seal-status", timeout=5))
                  if not st.get("initialized"):
                      print("not initialized - skip"); raise SystemExit(0)
                  if not st.get("sealed"):
                      print("unsealed - ok"); raise SystemExit(0)
                  key = json.loads(boto3.client("secretsmanager").get_secret_value(SecretId=os.environ["SECRET_ID"])["SecretString"])["unseal_key"]
                  req = urllib.request.Request(V + "unseal", data=json.dumps({"key": key}).encode(), method="PUT")
                  print("unseal ->", json.load(urllib.request.urlopen(req, timeout=5)).get("sealed"))
