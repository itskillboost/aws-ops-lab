# 샘플 앱의 정문 안내 데스크(Ingress) — AWS Load Balancer Controller 가 이것을 보고 ALB 를 만든다.
# podnet 모듈 구축 2와 K3 층(layers/k3-ingress.sh)이 같은 파일을 쓴다. __SID__ 는 학번으로 바뀐다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opslab-app
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing          # 인터넷에서 들어오는 ALB
    alb.ingress.kubernetes.io/target-type: ip                  # ALB 가 파드 IP 로 바로 보낸다(VPC CNI 덕분)
    alb.ingress.kubernetes.io/healthcheck-path: /health        # ALB 의 건강검진 경로
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30   # 빠지는 파드를 30초만 기다림(기본 300초)
    alb.ingress.kubernetes.io/load-balancer-name: __SID__-podnet-alb
    alb.ingress.kubernetes.io/tags: Course=opslab,Module=podnet,Owner=__SID__
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opslab-app
                port:
                  number: 80
