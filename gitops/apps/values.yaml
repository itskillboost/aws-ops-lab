# 루트 앱(opslab-root)이 valuesObject 로 채워 넘기는 값 — 수강생·계정마다 다르므로 Git 에는 빈 값만 둔다
repoURL: ""          # 내 Fork 주소 https://github.com/<ID>/aws-ops-lab.git
revision: ""         # 오늘 브랜치 opslab/<모듈>-<날짜>
sid: ""              # 학번
account: ""          # AWS 계정 ID (IRSA 역할 ARN 에 쓴다)
image:
  repository: ""     # 샘플 앱 이미지(강사 미러)
  tag: ""
busybox: ""          # DB 대기·배포 전 점검용 이미지(강사 미러)
# 운영 앱 이미지(릴리스) — image 모듈의 파이프라인이 빌드·스캔을 통과한 이미지로 이 두 줄을 커밋한다(sed 로 고치므로 한 줄씩 둔다).
# 비어 있으면 위 image(강사 미러 이미지)를 쓴다.
releaseRepository: "676206941602.dkr.ecr.ap-northeast-2.amazonaws.com/s00-image-app"
